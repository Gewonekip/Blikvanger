name: LicensePlates
options:
  bundleIdPrefix: nl.jobvandijke
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.4"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 5895SP2C78
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  LicensePlates:
    type: application
    platform: iOS
    sources:
      - path: LicensePlates
        excludes:
          - Resources/AppIconSource.svg
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.jobvandijke.LicensePlates
        PRODUCT_NAME: Parked
        PRODUCT_MODULE_NAME: LicensePlates
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Parked
        INFOPLIST_KEY_NSCameraUsageDescription: Parked uses the camera and LiDAR to attach vehicle information to parked cars in augmented reality. Images stay on this iPhone.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arkit
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    scheme:
      testTargets:
        - LicensePlatesTests
  LicensePlatesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LicensePlatesTests
    dependencies:
      - target: LicensePlates
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.jobvandijke.LicensePlatesTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Parked.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Parked"
        BUNDLE_LOADER: "$(TEST_HOST)"
